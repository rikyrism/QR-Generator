<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QRIS Hub Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>

  <body>
    <div class="theme-switch-wrapper">
      <div class="theme-switch" id="theme-toggle">
        <i class="fas fa-sun icon sun-icon"></i>
        <i class="fas fa-moon icon moon-icon"></i>
      </div>
    </div>

    <div class="container">
      <header>
        <h1>QRIS Generator</h1>
        <p>Upload a static QRIS code to generate a dynamic one</p>
      </header>

      <div class="stats-container" style="display: none">
        <!-- Merchant title will be inserted here dynamically -->
        <div class="merchant-title-container">
          <!-- Merchant name will go here -->
        </div>

        <div class="stats-box">
          <div class="stats-row">
            <div class="stat-item">
              <div class="stat-title">Total Transaksi</div>
              <div class="stat-value" id="total-transactions">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-title">Total Nilai</div>
              <div class="stat-value" id="total-value">Rp 0</div>
            </div>
          </div>

          <div class="stats-row average-row">
            <div class="stat-item full-width">
              <div class="stat-title">Rata-rata Transaksi</div>
              <div class="stat-value" id="average-value">Rp 0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="content-wrapper">
        <div class="left-panel">
          <div class="card">
            <h2><i class="fas fa-qrcode"></i> Scan QR Code</h2>
            <div class="scan-options">
              <button class="upload-button" onclick="document.getElementById('qris-image').click()"><i class="fas fa-upload"></i> Upload QR</button>
              <button id="camera-scan" class="scan-button"><i class="fas fa-camera"></i> Scan QR</button>
              <input type="file" id="qris-image" accept="image/*" hidden />
            </div>
            <div id="scanner-container" style="display: none; margin: 1rem 0">
              <div id="qr-reader" style="width: 100%"></div>
              <button id="stop-scan" class="secondary-button"><i class="fas fa-times"></i> Stop Scanning</button>
            </div>
            <div id="qr-reader-container" style="display: none"></div>
            <div class="qris-result">
              <h3>Scanned QRIS:</h3>
              <textarea id="qris-code" rows="3" readonly></textarea>
            </div>
          </div>
        </div>

        <div class="right-panel">
          <div class="card">
            <h2><i class="fas fa-cog"></i> Generate Dynamic QRIS</h2>
            <div class="form-group">
              <label for="amount">Amount (IDR)</label>
              <input type="number" id="amount" placeholder="10000" />
            </div>
            <div class="form-group">
              <label for="merchant-name">Merchant Name</label>
              <input type="text" id="merchant-name" placeholder="Merchant name" />
              <small>Leave blank to use the original merchant name from the scanned QR</small>
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="add-fee" />
              <label for="add-fee">Add Service Fee</label>
            </div>
            <div class="fee-options" id="fee-options" style="display: none">
              <div class="form-group">
                <label for="fee-type">Fee Type</label>
                <select id="fee-type">
                  <option value="percentage">Percentage</option>
                  <option value="fixed">Fixed Amount</option>
                </select>
              </div>
              <div class="form-group">
                <label for="fee-value">Percentage (%)</label>
                <input type="number" id="fee-value" step="0.1" value="0.6" />
              </div>
            </div>
            <button id="generate-btn" class="primary-button">Generate QR Code</button>
          </div>
        </div>
      </div>

      <div class="card result-card" id="result-card" style="display: none">
        <h2><i class="fas fa-check-circle"></i> Generated QR Code</h2>
        <div class="qr-result">
          <div class="qr-image-container" id="qr-image-container">
            <!-- QR Code will be displayed here -->
          </div>
          <div class="action-buttons">
            <button id="download-btn" class="action-button"><i class="fas fa-download"></i> Download QR Code</button>
            <!-- Changed from secondary to primary class for green background and white text -->
            <button id="copy-btn" class="action-button primary"><i class="fas fa-copy"></i> Copy String</button>
          </div>
        </div>
        <div class="qris-string">
          <h3>QRIS String:</h3>
          <textarea id="generated-qris-code" rows="3" readonly></textarea>
        </div>
      </div>
    </div>
    <div id="qr-reader-container" style="position: absolute; left: -9999px"></div>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
